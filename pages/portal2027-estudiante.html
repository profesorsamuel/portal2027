  <style>
/* portal2027-estudiante.css — panel del estudiante: menú de botones y datos de contacto más ordenados */
body[data-rol="estudiante"] .portal { max-width: 920px; }

/* Cabecera */
body[data-rol="estudiante"] .panel-cabecera { border-bottom: 0; padding: 1.4rem 1.5rem; margin-bottom: 1.25rem; border-radius: 16px; background: linear-gradient(135deg, var(--tinta) 0%, var(--tinta-suave) 100%); align-items: center; }
body[data-rol="estudiante"] .panel-cabecera h1 { color: #fff; }
body[data-rol="estudiante"] .panel-centro { color: var(--acento); }
body[data-rol="estudiante"] .panel-datos { color: #cfdedc; margin: 0; }
body[data-rol="estudiante"] .panel-cabecera .boton-secundario { color: #fff; border-color: rgba(255,255,255,.7); }
body[data-rol="estudiante"] .panel-cabecera .boton-secundario:hover { background: rgba(255,255,255,.14); }

/* Menú de botones */
.menu-estudiante { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; }
.menu-estudiante[hidden] { display: none; }
.tarjeta-menu { position: relative; display: grid; gap: .3rem; align-content: start; text-align: left; font: inherit; color: var(--texto); background: var(--blanco); border: 1px solid var(--linea); border-radius: 16px; padding: 1.2rem 1.2rem 1.1rem; cursor: pointer; box-shadow: 0 1px 2px rgba(20,50,59,.06); transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
.tarjeta-menu:hover { transform: translateY(-2px); border-color: var(--tinta-suave); box-shadow: 0 6px 16px rgba(20,50,59,.12); }
.tarjeta-menu:active { transform: translateY(0); }
.tarjeta-icono { display: grid; place-items: center; width: 3rem; height: 3rem; border-radius: 14px; background: #e7eeed; font-size: 1.5rem; margin-bottom: .4rem; }
.tarjeta-titulo { font-family: var(--fuente-titulo); font-size: 1.2rem; font-weight: 700; color: var(--tinta); line-height: 1.2; }
.tarjeta-texto { font-size: .9rem; color: var(--texto-suave); }
.tarjeta-insignia { position: absolute; top: .9rem; right: .9rem; background: var(--acento); color: #2b1d00; font-size: .75rem; font-weight: 700; padding: .2rem .6rem; border-radius: 999px; }
.tarjeta-insignia[hidden] { display: none; }

/* Barra para volver al menú */
.volver-menu { display: flex; align-items: center; gap: .9rem; flex-wrap: wrap; margin-bottom: 1rem; }
.volver-menu[hidden] { display: none; }
.volver-titulo { font-family: var(--fuente-titulo); font-size: 1.15rem; font-weight: 700; color: var(--tinta); }
.volver-menu .boton { padding: .6rem 1rem; font-size: .95rem; }

/* Secciones */
body[data-rol="estudiante"] .bloque { border-radius: 16px; padding: 1.5rem; }
body[data-rol="estudiante"] .bloque > h2 { font-size: 1.45rem; }
body[data-rol="estudiante"] .bloque > h3 { margin-top: 1.6rem; padding-top: 1.1rem; border-top: 1px solid var(--linea); }

/* Mi información: datos de contacto */
.formulario-ficha { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem 1.1rem; margin-top: .9rem; padding: 1.1rem; background: #f7faf9; border: 1px solid var(--linea); border-radius: 14px; }
.formulario-ficha label { margin: 0; display: grid; gap: .35rem; font-size: .92rem; color: var(--tinta); }
.formulario-ficha input { font-weight: 400; padding: .7rem .85rem; border-radius: 10px; border-color: #b9c7c4; }
.formulario-ficha input:focus { outline: 3px solid rgba(232,163,23,.45); border-color: var(--acento-oscuro); }
.formulario-ficha > .bloque-ayuda, .formulario-ficha > .mensaje, .formulario-ficha > .boton { grid-column: 1 / -1; margin-top: 0; }
.formulario-ficha > .boton { justify-self: start; background: var(--tinta); color: #fff; border-color: var(--tinta); border-radius: 10px; padding: .8rem 1.8rem; }
.formulario-ficha > .boton:hover { background: var(--tinta-suave); }

/* Ejercicios virtuales dentro de notas */
.apartado-ejercicios { margin-top: 1.6rem; padding-top: 1.1rem; border-top: 1px solid var(--linea); }
.apartado-ejercicios > h3 { margin-top: 0; }

/* Mis notas: tarjetas por materia, notas con su detalle y promedio final */
.materia-notas { margin-top: 1.1rem; padding: 1.1rem; background: #f7faf9; border: 1px solid var(--linea); border-radius: 14px; }
.materia-notas > h3 { margin: 0 0 .7rem; padding: 0; border: 0; }
.grupo-notas { margin-top: .9rem; }
.grupo-notas h4 { margin: 0 0 .35rem; font-size: .95rem; color: var(--tinta); display: flex; align-items: center; justify-content: space-between; gap: .6rem; flex-wrap: wrap; }
.grupo-notas .promedio-grupo { font-size: .85rem; font-weight: 700; color: var(--tinta); background: #e7eeed; border-radius: 999px; padding: .15rem .7rem; }
.tabla-notas { width: 100%; border-collapse: collapse; background: var(--blanco); font-size: .92rem; }
.tabla-notas th, .tabla-notas td { padding: .55rem .7rem; text-align: left; border-bottom: 1px solid var(--linea); vertical-align: middle; }
.tabla-notas th { font-size: .8rem; color: var(--texto-suave); font-weight: 700; }
.tabla-notas td.col-nota, .tabla-notas th.col-nota { text-align: center; width: 5.5rem; }
.nota-que { font-weight: 700; color: var(--tinta); }
.nota-tema { color: var(--texto); }
.etiqueta-tipo { display: inline-block; background: #e7eeed; color: var(--tinta); font-size: .78rem; font-weight: 700; padding: .15rem .6rem; border-radius: 999px; white-space: nowrap; }
.nota-valor { display: inline-block; min-width: 2.6rem; font-weight: 700; font-size: 1rem; padding: .15rem .5rem; border-radius: 8px; background: #e6f3ea; color: #1d5b34; }
.nota-valor.nota-baja { background: #fbe9e7; color: #9b2c1f; }
.nota-valor.nota-vacia { background: transparent; color: var(--texto-suave); font-weight: 400; font-size: .85rem; }
.promedio-final { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-top: 1rem; padding: .9rem 1.1rem; background: var(--tinta); color: #fff; border-radius: 12px; }
.promedio-final .pf-texto { font-weight: 700; }
.promedio-final .pf-ayuda { display: block; font-weight: 400; font-size: .8rem; color: #cfdedc; }
.promedio-final .pf-numero { font-family: var(--fuente-titulo); font-size: 1.8rem; font-weight: 700; color: var(--acento); }
.promedio-final.sin-nota .pf-numero { font-size: 1rem; color: #cfdedc; font-weight: 400; }
@media (max-width: 640px) { .materia-notas { padding: .8rem; } .tabla-notas th, .tabla-notas td { padding: .45rem .5rem; } }
@media print { .materia-notas { background: #fff; break-inside: avoid; } .promedio-final { background: #fff; color: #000; border: 1px solid #000; } .promedio-final .pf-numero, .promedio-final .pf-ayuda { color: #000; } }

/* Mi foto */
.foto-archivo { font-size: .88rem; color: var(--texto-suave); }
.foto-controles .boton { padding: .65rem 1rem; font-size: .95rem; }
.foto-controles input[hidden] { display: none; }
body[data-rol="estudiante"] .foto-tarjeta { padding: 1.1rem; background: #f7faf9; border: 1px solid var(--linea); border-radius: 14px; align-items: center; }
body[data-rol="estudiante"] .foto-marco { border-radius: 14px; }

@media (max-width: 640px) {
  .formulario-ficha { grid-template-columns: 1fr; padding: .9rem; }
  .menu-estudiante { grid-template-columns: 1fr; }
  .tarjeta-menu { grid-template-columns: auto 1fr; column-gap: .9rem; align-items: center; padding: 1rem; }
  .tarjeta-icono { grid-row: span 2; margin: 0; }
  .tarjeta-insignia { position: static; grid-column: 2; justify-self: start; }
  body[data-rol="estudiante"] .panel-cabecera { padding: 1.1rem; }
  body[data-rol="estudiante"] .bloque { padding: 1.1rem; }
}
@media print {
  .menu-estudiante, .volver-menu { display: none !important; }
}
